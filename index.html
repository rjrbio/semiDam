<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas DAM</title>
    <link rel="stylesheet" href="styles.css">
    <!-- CDN de iconos (Lucide) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body class="min-h-screen app-shell">
    <div class="max-w-6xl mx-auto p-2 sm:p-4 app-container">
        <!-- Header -->
        <header class="card app-header">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div class="brand text-center sm:text-left">
                    <h1 class="brand-title flex items-center justify-center sm:justify-start gap-2">
                        <i data-lucide="book-open" class="text-indigo-600"></i>
                        <span class="hidden xs:inline">Gestor de Tareas DAM</span>
                        <span class="xs:hidden">Tareas DAM</span>
                    </h1>
                    <p class="brand-subtitle">Organiza tus tareas y exámenes</p>
                </div>
                <div class="flex gap-2 sm:gap-3 justify-center sm:justify-end items-center">
                    <button id="btn-tema" class="btn btn-icon btn-theme" title="Cambiar tema">
                        <i data-lucide="sun" size="18"></i>
                        <span class="hidden sm:inline">Tema</span>
                    </button>
                    <button id="btn-sincronizar" class="btn btn-success btn-icon" title="Sincronizar con la nube">
                        <i data-lucide="refresh-cw" size="18"></i>
                        <span class="hidden sm:inline">Sync</span>
                    </button>
                    <button id="btn-nueva-tarea" class="btn btn-primary btn-icon">
                        <i data-lucide="plus" size="18"></i>
                        <span class="hidden xs:inline">Nueva Tarea</span>
                        <span class="xs:hidden">Nueva</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Formulario (inicialmente oculto) -->
        <div id="formulario-tarea" class="card form-card hidden">
            <h2 class="section-title">Añadir Tarea o Examen</h2>
            <form id="form-tarea" class="form-grid">
                <div class="form-field sm:col-span-2 md:col-span-1">
                    <label class="form-label">Título</label>
                    <input type="text" id="titulo" name="titulo" required
                           class="input"
                           placeholder="Ej: Práctica SQL">
                </div>

                <div class="form-field sm:col-span-2 md:col-span-1">
                    <label class="form-label">Asignatura</label>
                    <select id="asignatura" name="asignatura" required
                            class="input">
                        <option value="Bases de datos">Bases de datos</option>
                        <option value="Digitalización">Digitalización</option>
                        <option value="Entornos de desarrollo">Entornos de desarrollo</option>
                        <option value="IPE1">IPE1</option>
                        <option value="Lenguajes de marca">Lenguajes de marca</option>
                        <option value="Programación">Programación</option>
                        <option value="Sistemas informáticos">Sistemas informáticos</option>
                        <option value="Sostenibilidad">Sostenibilidad</option>
                    </select>
                </div>

                <div class="form-field">
                    <label class="form-label">Tipo</label>
                    <select id="tipo" name="tipo" required
                            class="input">
                        <option value="tarea">Tarea</option>
                        <option value="examen">Examen</option>
                    </select>
                </div>

                <div class="form-field">
                    <label class="form-label">Fecha de entrega</label>
                    <input type="date" id="fecha" name="fecha" required
                           class="input">
                </div>

                <div class="form-field">
                    <label class="form-label">Plataforma</label>
                    <select id="plataforma" name="plataforma" required
                            class="input">
                        <option value="Junta de Andalucía">Junta de Andalucía</option>
                        <option value="Portada">Portada</option>
                    </select>
                </div>

                <div class="form-field">
                    <label class="form-label">Descripción (opcional)</label>
                    <input type="text" id="descripcion" name="descripcion"
                           class="input" placeholder="Detalles adicionales">
                </div>

                <div class="form-actions sm:col-span-2">
                    <button type="submit" class="btn btn-primary">
                        Agregar
                    </button>
                    <button type="button" id="btn-cancelar" class="btn btn-secondary">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>

        <!-- Filtros y Controles de Vista -->
        <div class="card toolbar">
            <div class="toolbar-inner">
                <!-- Filtros de asignaturas -->
                <div id="filtros" class="flex flex-wrap gap-1 sm:gap-2">
                    <button data-filtro="Todas" class="filtro-btn px-2 sm:px-4 py-1 sm:py-2 rounded-lg transition-colors bg-indigo-600 text-white text-xs sm:text-sm">
                        Todas
                    </button>
                    <button data-filtro="Bases de datos" class="filtro-btn px-2 sm:px-4 py-1 sm:py-2 rounded-lg transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm">
                        <span class="hidden sm:inline">Bases de datos</span>
                        <span class="sm:hidden">BBDD</span>
                    </button>
                    <button data-filtro="Digitalización" class="filtro-btn px-2 sm:px-4 py-1 sm:py-2 rounded-lg transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm">
                        <span class="hidden sm:inline">Digitalización</span>
                        <span class="sm:hidden">Digital</span>
                    </button>
                    <button data-filtro="Entornos de desarrollo" class="filtro-btn px-2 sm:px-4 py-1 sm:py-2 rounded-lg transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm">
                        <span class="hidden sm:inline">Entornos de desarrollo</span>
                        <span class="sm:hidden">ED</span>
                    </button>
                    <button data-filtro="IPE1" class="filtro-btn px-2 sm:px-4 py-1 sm:py-2 rounded-lg transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm">
                        IPE1
                    </button>
                    <button data-filtro="Lenguajes de marca" class="filtro-btn px-2 sm:px-4 py-1 sm:py-2 rounded-lg transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm">
                        <span class="hidden sm:inline">Lenguajes de marca</span>
                        <span class="sm:hidden">LM</span>
                    </button>
                    <button data-filtro="Programación" class="filtro-btn px-2 sm:px-4 py-1 sm:py-2 rounded-lg transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm">
                        <span class="hidden sm:inline">Programación</span>
                        <span class="sm:hidden">Prog</span>
                    </button>
                    <button data-filtro="Sistemas informáticos" class="filtro-btn px-2 sm:px-4 py-1 sm:py-2 rounded-lg transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm">
                        <span class="hidden sm:inline">Sistemas informáticos</span>
                        <span class="sm:hidden">SI</span>
                    </button>
                    <button data-filtro="Sostenibilidad" class="filtro-btn px-2 sm:px-4 py-1 sm:py-2 rounded-lg transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm">
                        <span class="hidden sm:inline">Sostenibilidad</span>
                        <span class="sm:hidden">Sost</span>
                    </button>
                </div>
                
                <!-- Separador -->
                <div class="divider"></div>
                
                <!-- Controles de vista y archivados -->
                <div class="flex flex-wrap gap-2 items-center justify-between">
                    <div class="toolbar-group">
                        <button id="btn-vista-lista" class="vista-btn px-3 sm:px-4 py-2 rounded-lg transition-colors bg-indigo-600 text-white text-xs sm:text-sm flex items-center gap-1">
                            <i data-lucide="list" size="16"></i>
                            <span>Lista</span>
                        </button>
                        <button id="btn-vista-calendario" class="vista-btn px-3 sm:px-4 py-2 rounded-lg transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm flex items-center gap-1">
                            <i data-lucide="calendar" size="16"></i>
                            <span>Calendario</span>
                        </button>
                    </div>
                    
                    <button data-filtro="Archivadas" class="filtro-btn px-3 sm:px-4 py-2 rounded-lg transition-colors bg-gray-100 text-gray-700 hover:bg-gray-200 text-xs sm:text-sm flex items-center gap-1">
                        <i data-lucide="archive" size="16"></i>
                        <span>Archivadas</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Contenedor de Tareas (Lista y Calendario) -->
        <div id="lista-tareas" class="space-y-4 task-list">
            <!-- Las tareas se insertarán aquí dinámicamente -->
        </div>
        
        <div id="vista-calendario" class="hidden calendar-view">
            <!-- El calendario se insertará aquí dinámicamente -->
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="user-system.js"></script>
    <script src="script.js"></script>
    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();
    </script>
</body>
</html>
